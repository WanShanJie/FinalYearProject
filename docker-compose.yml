version: "3.8"

services:
  # --------------------------------------------------------
  # 1. FastAPI Backend (API Server)
  # --------------------------------------------------------
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: deepfake-backend:latest
    container_name: deepfake_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./src/backend/.env
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_NAME=deepfake_db
      - DB_PASSWORD=password
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
      - ./src/backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # --------------------------------------------------------
  # 2. Celery Worker (AI Inference Node)
  # --------------------------------------------------------
  celery_worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: deepfake-backend:latest
    container_name: deepfake_celery_worker
    restart: always
    # Wait for DB and Redis, then start the celery worker
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=1", "--pool=solo"]
    env_file:
      - ./src/backend/.env
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_NAME=deepfake_db
      - DB_PASSWORD=password
      - REDIS_URL=redis://redis:6379/0
      # Use this to enable GPU pass-through if running on Nvidia:
      # - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - uploads_data:/app/uploads
      - ./src/backend:/app
    # If running on a GPU Cloud Server (RunPod/Lambda), uncomment the below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # --------------------------------------------------------
  # 3. Redis (Message Broker for Celery Queue)
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: deepfake_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # --------------------------------------------------------
  # 4. MySQL (Database)
  # --------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: deepfake_mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=deepfake_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  uploads_data:
