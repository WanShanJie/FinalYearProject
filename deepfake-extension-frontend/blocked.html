<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blocked — Deepfake Detected</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #3a1a1a;
      border-radius: 12px;
      padding: 40px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .shield {
      font-size: 3.5rem;
      margin-bottom: 16px;
      display: block;
    }
    h1 {
      color: #ef4444;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #9ca3af;
      font-size: 0.9rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .meta-table {
      background: #111;
      border-radius: 8px;
      padding: 16px;
      text-align: left;
      margin-bottom: 28px;
      font-size: 0.85rem;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #222;
    }
    .meta-row:last-child { border-bottom: none; }
    .meta-label { color: #6b7280; flex-shrink: 0; margin-right: 12px; }
    .meta-value { color: #e0e0e0; text-align: right; word-break: break-all; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .badge-fake { background: #7f1d1d; color: #fca5a5; }
    .badge-suspicious { background: #78350f; color: #fcd34d; }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-back { background: #374151; color: #e0e0e0; }
    .btn-proceed {
      background: transparent;
      border: 1px solid #4b5563;
      color: #9ca3af;
      font-size: 0.8rem;
    }
    .warning-note {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #6b7280;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="shield">🛡️</span>
    <h1>Access Blocked</h1>
    <p class="subtitle">
      This video has been identified as a suspected deepfake by the
      Deepfake Verification system and cannot be accessed.
    </p>

    <div class="meta-table">
      <div class="meta-row">
        <span class="meta-label">Verdict</span>
        <span class="meta-value"><span class="badge badge-fake" id="verdictBadge">FAKE</span></span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Risk Score</span>
        <span class="meta-value" id="riskScore">—</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Title</span>
        <span class="meta-value" id="videoTitle">—</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Video ID</span>
        <span class="meta-value" id="videoId">—</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-back" id="backBtn">Go Back</button>
      <button class="btn btn-proceed" id="proceedBtn">Proceed anyway (unsafe)</button>
    </div>
    <p class="warning-note">
      Proceeding will load the original URL without protection.<br/>
      This action is logged and not recommended.
    </p>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
